name: CI

on:
  push:
    branches: [master]
  pull_request:
    branches: [master]

jobs:
  test:
    name: Tests
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: "New project/package-lock.json"

      - name: Install dependencies
        run: npm ci
        working-directory: "New project"

      - name: Run tests
        run: npm test --if-present
        working-directory: "New project"

  typecheck:
    name: Typecheck
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: "New project/package-lock.json"

      - name: Install dependencies
        run: npm ci
        working-directory: "New project"

      - name: Typecheck
        run: npm run typecheck --workspaces
        working-directory: "New project"

  build:
    name: Build
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: "New project/package-lock.json"

      - name: Install dependencies
        run: npm ci
        working-directory: "New project"

      - name: Build packages
        run: npm run build --workspaces --if-present
        working-directory: "New project"

  lint:
    name: Lint
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: "New project/package-lock.json"

      - name: Install dependencies
        run: npm ci
        working-directory: "New project"

      - name: Lint
        run: npm run lint
        working-directory: "New project"

  coverage:
    name: Coverage
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: "New project/package-lock.json"

      - name: Install dependencies
        run: npm ci
        working-directory: "New project"

      - name: Coverage report
        run: npm run coverage
        working-directory: "New project"
