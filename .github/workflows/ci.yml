name: CI

on:
  push:
    branches: [master]
  pull_request:
    branches: [master]

jobs:
  test:
    name: Tests
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
          cache-dependency-path: "New project/package-lock.json"

      - name: Install dependencies
        run: npm ci
        working-directory: "New project"

      - name: Run tests
        run: npm test --if-present
        working-directory: "New project"

  typecheck:
    name: Typecheck
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
          cache-dependency-path: "New project/package-lock.json"

      - name: Install dependencies
        run: npm ci
        working-directory: "New project"

      - name: Typecheck
        run: npm run typecheck --if-present
        working-directory: "New project"
