name: clinic-evolution

services:
  evolution-api:
    image: evoapicloud/evolution-api:latest
    container_name: clinic_evolution_api
    restart: unless-stopped
    depends_on:
      - postgres
      - redis
    ports:
      - "127.0.0.1:8080:8080"
    env_file:
      - .env
    volumes:
      - evolution_instances:/evolution/instances
    networks:
      - clinic-evolution

  postgres:
    image: postgres:15
    container_name: clinic_evolution_postgres
    restart: unless-stopped
    environment:
      POSTGRES_DB: evolution_db
      POSTGRES_USER: evolution
      POSTGRES_PASSWORD: evolution_local_password
    volumes:
      - postgres_data:/var/lib/postgresql/data
    networks:
      - clinic-evolution

  redis:
    image: redis:7-alpine
    container_name: clinic_evolution_redis
    restart: unless-stopped
    command: redis-server --appendonly yes
    volumes:
      - redis_data:/data
    networks:
      - clinic-evolution

volumes:
  evolution_instances:
  postgres_data:
  redis_data:

networks:
  clinic-evolution:
    driver: bridge
